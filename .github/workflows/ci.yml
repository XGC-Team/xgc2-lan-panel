name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-tests:
    name: Go and web quality
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Test in the XGC2 noble image
        run: |
          set -euo pipefail
          image=ghcr.io/xgc-team/xgc2-images/xgc2-build-noble-dev:1.0.0
          docker pull "${image}"
          docker run --rm \
            --user "$(id -u):$(id -g)" -e HOME=/tmp \
            -v "${GITHUB_WORKSPACE}:/work" -w /work \
            "${image}" \
            bash -lc '
              set -euo pipefail
              git config --global --add safe.directory /work
              npm --prefix web ci
              npm --prefix web run typecheck
              npm --prefix web test
              npm --prefix web run build
              test -z "$(gofmt -l cmd internal)"
              go vet ./...
              go test ./...
              ./.xgc2/scripts/build.sh
              ./bin/xgc2-lan-panel-linux-"$(go env GOARCH)" --version
            '

  package-compliance:
    name: Package compliance
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Check whitespace and package contract
        run: |
          set -euo pipefail
          git diff --check HEAD
          image=ghcr.io/xgc-team/xgc2-images/xgc2-build-noble-dev:1.0.0
          docker pull "${image}"
          docker run --rm \
            --user "$(id -u):$(id -g)" -e HOME=/tmp \
            -v "${GITHUB_WORKSPACE}:/work" -w /work \
            "${image}" \
            bash -lc './.xgc2/scripts/check_package_compliance.sh'

  deb-build-and-smoke:
    name: Debian ${{ matrix.distribution }} ${{ matrix.architecture }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - distribution: bionic
            image: ghcr.io/xgc-team/xgc2-images/xgc2-build-bionic-dev:1.0.0
            architecture: amd64
            platform: linux/amd64
            runner: ubuntu-latest
          - distribution: bionic
            image: ghcr.io/xgc-team/xgc2-images/xgc2-build-bionic-dev:1.0.0
            architecture: arm64
            platform: linux/arm64
            runner: ubuntu-24.04-arm
          - distribution: focal
            image: ghcr.io/xgc-team/xgc2-images/xgc2-build-focal-dev:1.0.0
            architecture: amd64
            platform: linux/amd64
            runner: ubuntu-latest
          - distribution: focal
            image: ghcr.io/xgc-team/xgc2-images/xgc2-build-focal-dev:1.0.0
            architecture: arm64
            platform: linux/arm64
            runner: ubuntu-24.04-arm
          - distribution: jammy
            image: ghcr.io/xgc-team/xgc2-images/xgc2-build-jammy-dev:1.0.0
            architecture: amd64
            platform: linux/amd64
            runner: ubuntu-latest
          - distribution: jammy
            image: ghcr.io/xgc-team/xgc2-images/xgc2-build-jammy-dev:1.0.0
            architecture: arm64
            platform: linux/arm64
            runner: ubuntu-24.04-arm
          - distribution: noble
            image: ghcr.io/xgc-team/xgc2-images/xgc2-build-noble-dev:1.0.0
            architecture: amd64
            platform: linux/amd64
            runner: ubuntu-latest
          - distribution: noble
            image: ghcr.io/xgc-team/xgc2-images/xgc2-build-noble-dev:1.0.0
            architecture: arm64
            platform: linux/arm64
            runner: ubuntu-24.04-arm
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Prepare host CI directories
        run: |
          install -d "$GITHUB_WORKSPACE/.ci/build-manifests"

      - name: Build UI in noble-dev for bionic
        if: matrix.distribution == 'bionic'
        run: |
          set -euo pipefail
          image=ghcr.io/xgc-team/xgc2-images/xgc2-build-noble-dev:1.0.0
          docker pull "${image}"
          docker run --rm \
            --user "$(id -u):$(id -g)" -e HOME=/tmp \
            -v "${GITHUB_WORKSPACE}:/work" -w /work \
            "${image}" \
            bash -lc '
              set -euo pipefail
              git config --global --add safe.directory /work
              npm --prefix web ci
              npm --prefix web run build
              rm -rf cmd/xgc2-lan-panel/ui
              mkdir -p cmd/xgc2-lan-panel/ui
              cp -a web/dist/. cmd/xgc2-lan-panel/ui/
            '

      - name: Build debs and smoke-test in the XGC2 image
        env:
          PACKAGE_DISTRIBUTION: ${{ matrix.distribution }}
        run: |
          set -euo pipefail
          test "$(dpkg --print-architecture)" = "${{ matrix.architecture }}"
          docker pull "${{ matrix.image }}"
          docker run --rm \
            --platform "${{ matrix.platform }}" \
            --user "$(id -u):$(id -g)" -e HOME=/tmp \
            -e PACKAGE_DISTRIBUTION \
            -v "${GITHUB_WORKSPACE}:/work" \
            -w /work \
            "${{ matrix.image }}" \
            bash -lc '
              set -euo pipefail
              git config --global --add safe.directory /work
              for pkg in curl dpkg-dev fakeroot file ca-certificates; do
                dpkg -s "${pkg}" >/dev/null
              done
              ./.xgc2/scripts/build_deb.sh
            '

      - name: Install debs and smoke-test as root
        run: |
          set -euo pipefail
          docker run --rm \
            --platform "${{ matrix.platform }}" \
            -v "${GITHUB_WORKSPACE}:/work:ro" \
            -w /work \
            "${{ matrix.image }}" \
            bash -lc '
              set -euo pipefail
              dpkg -i ./debs/xgc2-lan-probe_*.deb ./debs/xgc2-lan-beacon_*.deb
              ./.xgc2/scripts/smoke_test_installed.sh
            '

      - name: Create trusted build manifest
        run: |
          set -euo pipefail
          product_version="$(awk -F': *' '/^version:/ {print $2; exit}' .xgc2/product.yml)"
          python3 .xgc2/scripts/xgc2_artifact_manifest.py build \
            --deb-dir debs \
            --output-dir .ci/build-manifests \
            --product xgc2-lan-panel \
            --product-version "${product_version}" \
            --distribution "${{ matrix.distribution }}" \
            --architecture "${{ matrix.architecture }}" \
            --source-sha "${GITHUB_SHA}" \
            --ci-run-id "${GITHUB_RUN_ID}" \
            --ci-workflow "${GITHUB_WORKFLOW}" \
            --ci-workflow-ref "${GITHUB_WORKFLOW_REF}"
          python3 .xgc2/scripts/xgc2_artifact_manifest.py verify-build \
            --artifact-dir . \
            --deb-output-dir .ci/verified-debs \
            --manifest-output-dir .ci/verified-manifests \
            --product xgc2-lan-panel \
            --product-version "${product_version}" \
            --distribution "${{ matrix.distribution }}" \
            --architecture "${{ matrix.architecture }}" \
            --source-sha "${GITHUB_SHA}" \
            --ci-run-id "${GITHUB_RUN_ID}"

      - name: Upload trusted deb artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: xgc2-lan-panel-${{ matrix.distribution }}-${{ matrix.architecture }}
          path: |
            debs/*.deb
            .ci/build-manifests/*.json
          retention-days: 14
          include-hidden-files: true
